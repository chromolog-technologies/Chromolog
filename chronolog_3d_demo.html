<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chronolog 3D Logo Demo</title>
  <style>
    html,body{margin:0;height:100%;background:#07091a;overflow:hidden}
    canvas{display:block;width:100%;height:100%}
    .hint{position:fixed;left:18px;bottom:18px;padding:10px 14px;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#d9ddff;background:rgba(7,9,26,.65);backdrop-filter:blur(10px);font:14px/1.3 system-ui,sans-serif}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Drag to rotate • Scroll to zoom • Double-click to toggle auto-rotate</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07091a);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0.0, 0.03, 1.35);

// Premium studio-style lighting.
scene.add(new THREE.HemisphereLight(0x8fc7ff, 0x220b46, 1.8));
const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.set(2, 3, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6b4cff, 2.2);
rim.position.set(-3, 1, -2);
scene.add(rim);

const root = new THREE.Group();
scene.add(root);

const loader = new GLTFLoader();
loader.load('./chronolog_logo_3d_fixed.glb', (gltf)=>{
  root.add(gltf.scene);
  // Keep the asset centered and presentation-sized.
  gltf.scene.position.set(0,0,0);
}, undefined, (err)=>{
  console.error('GLB load failed:', err);
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 0.75;
controls.maxDistance = 2.5;
controls.target.set(0,0,0);

let autoRotate = true;
let pointerDown = false;
controls.addEventListener('start', ()=> pointerDown = true);
controls.addEventListener('end', ()=> pointerDown = false);

document.addEventListener('dblclick', ()=> autoRotate = !autoRotate);

function animate(){
  requestAnimationFrame(animate);
  if(autoRotate && !pointerDown){ root.rotation.y += 0.0045; }
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
