name: Deploy Chromolog to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./frontend

      - name: 🏗️ Build Production Bundle
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: 🧹 Clean Old Frontend Assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            rm -rf /home/u818464796/domains/chromologtechnologies.com/public_html/assets
            rm -f /home/u818464796/domains/chromologtechnologies.com/public_html/index.html
            rm -f /home/u818464796/domains/chromologtechnologies.com/public_html/favicon*
            rm -f /home/u818464796/domains/chromologtechnologies.com/public_html/apple-touch*

      - name: 🚀 SFTP Deploy Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "frontend/dist/"
          target: "/home/u818464796/domains/chromologtechnologies.com/public_html"
          strip_components: 2
