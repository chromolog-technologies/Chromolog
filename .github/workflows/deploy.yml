name: Deploy Chromolog to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./frontend

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: 📦 Install Growth API Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: ./growth-api

      - name: 🏗️ Build Production Bundle
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}

      - name: 🏢 Build Company Portal
        run: npm ci && npm run build
        working-directory: ./portal

      - name: 🧹 Prepare Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            set -e
            cd /home/u818464796/domains/chromologtechnologies.com/public_html
            # Keep previous builds' hashed files so pages cached by browsers/servers still load;
            # only prune files older than 30 days.
            find assets portal/assets -type f -mtime +30 -delete 2>/dev/null || true
            rm -f favicon* apple-touch*
            # Remove the raw repository copy left by Hostinger's old Git auto-deploy (not part of the site).
            rm -rf .git .github frontend growth-api growth-os scratch_gen scratch_glb
            rm -rf portal/src portal/public portal/node_modules
            rm -f portal/package.json portal/package-lock.json portal/vite.config.js portal/README.md portal/.gitignore
            rm -f README.md package-lock.json .gitignore *.glb chronolog_3d_demo.html chronolog_multiview_demo.html "ChatGPT Image Sep 21, 2026, 12_13_47 AM.png"

      - name: 🚀 SFTP Deploy Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "frontend/dist/"
          target: "/home/u818464796/domains/chromologtechnologies.com/public_html"
          strip_components: 2

      - name: 🤖 SFTP Deploy Growth API (AI Sales Agent)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "growth-api/"
          target: "/home/u818464796/domains/chromologtechnologies.com/public_html/api/ai"
          strip_components: 1

      - name: 🏢 SFTP Deploy Company Portal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "portal/dist/"
          target: "/home/u818464796/domains/chromologtechnologies.com/public_html/portal"
          strip_components: 2

      - name: 🔄 Refresh Page Timestamps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            # New timestamps make LiteSpeed rebuild its compressed copies of the entry pages.
            sleep 2
            cd /home/u818464796/domains/chromologtechnologies.com/public_html
            touch index.html sw.js portal/index.html
